name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flake-check:
    strategy:
      matrix:
        runner: [x86_64-linux, aarch64-darwin]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: nix flake check ./dev --print-build-logs
