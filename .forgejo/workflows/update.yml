name: update

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  catalog:
    runs-on: x86_64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/update.sh
      - name: commit
        run: |
          if git diff --quiet -- versions; then
            exit 0
          fi
          # A catalog that breaks the checks must not reach consumers of the flake.
          nix flake check ./dev --print-build-logs
          git config user.name "forgejo-actions"
          git config user.email "actions@git.natsukium.com"
          git commit -m "versions: update catalog" -- versions
          git push origin HEAD:main
